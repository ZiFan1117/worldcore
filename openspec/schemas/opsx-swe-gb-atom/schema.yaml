# ── 经验：把踩过的坑写成硬约束或检查项（**每行必须给会红的执行者**，否则它是装饰）────
# 规矩（来自 skill §五）：**没有执行者的经验条目不许写在这里**——它只会被读成已成立。
# 所以每行 `enforcer` 三选一：① 仓内可跑的命令（给判据号或脚本）② 人工项（写明由谁在哪个评审席上核）
# ③ **未建**（如实写，并给出落点）——**不许留空**。
experience:
  - rule: "冲突时写明『谁让』：让的是哪一条（path:line ＋逐字引文）／为什么让／谁批的。半写＝不写"
    enforcer: "world-core/tools/spec_bridge.py 判据⑦（按件整体判，三要素可分布在 proposal／design／tasks 里）"
  - rule: "文档集封闭：每个阶段就那么几份，不许新增、不许拆册；要加要拆先经作者批准"
    enforcer: "人工：评审席按 `.agents/skills/worldcore-sdd/SKILL.md` §二 逐件核（无机器判据）"
  - rule: "正文不掺修订记录与『原写…现改为…』对照（修订史归 git 与 change 的 design.md／audit.md）"
    enforcer: "world-core/tools/spec_bridge.py 判据⑧（流程文档）与判据⑨（规格正文与 delta）"
  - rule: "不做『探针』这类额外件：要检查就在既有门禁脚本里就地做，检查数据必须是已声明的"
    enforcer: "人工：评审席核『有没有为了检查另造第三个对象』；机核侧由 `world-core/check.sh` 的步骤清单承担（不另立脚本）"
  - rule: "每条判据都必须会红：一判据一反例，反例不变红即判该守卫是装饰，拒绝合入"
    enforcer: "world-core/tools/spec_bridge.py --self-test；world-core/tools/module_graph.py --self-test；world-core/check.sh --self-test"
  - rule: "判据不许取『文件里第一处字样』：凡判某字段填没填，按栏位形态取，有几处就查几处"
    enforcer: "world-core/tools/spec_bridge.py 判据⑥（按 `| 批准人 | 值 |` 栏位形态取，占位一律判红）"
  - rule: "读数不许写死，一律现取；一个事实只有一个权威载体，别处只引用不复述"
    enforcer: "world-core/tools/spec_bridge.py 判据⑪（BRIDGE 与生成器逐字节一致）／⑫（specmap 生成器哈希）／⑬（节对齐来源坐标）"
  - rule: "生成物不许手编；生成链必须在仓内（『闸在版本控制之外』等于没有闸）"
    enforcer: "world-core/tools/spec_bridge.py 判据⑪／⑫／⑬；判据⑮（两份文档的清单表 ≡ 实际，双向）"
  - rule: "绝不把『没做到』写成『做到了』：还没有断言的条目写『证据（待补）』并给落点；未实现的边界写实话"
    enforcer: "world-core/tools/spec_bridge.py 判据②（证据行没有反引号 token 即判红——形态上等于声称存在）；人工：评审席逐条核断言与声明是否相符"
  - rule: "原子化：单意图／一个原子一个文件夹（契约＋实现＋测试同夹）／deps == import 且无环／生成物不手编／UTF-8 无 BOM"
    enforcer: "world-core/tools/module_graph.py（A-1／A-2／A-4）；world-core/tools/plain_text_audit.py（A-6，含 BOM 反例）"
  - rule: "读法三坑：中文串里用「」不用 ASCII 双引号；引用写『命令＋步骤名』不写行号；条目数取 `test result:` 的 totals 不按 token 数"
    enforcer: "人工：评审席按 `.agents/skills/worldcore-sdd/SKILL.md` §十三 的『写作自查表』与『跑门禁』两条逐件核（**未建机器判据**）"
  - rule: "并发作业：一个工区独占一组文件；暂存前先 diff；按 HEAD 重建一棵树再验（双坐标：HEAD 上如何／工作区如何）"
    enforcer: "人工：评审席核 `git status --porcelain` 逐字交件；**未建机器判据**"
  - rule: "反例不许互相污染（夹具被前一个反例删掉，后面的反例就成了假绿）＋ 每条判据配正控（把『不该红的』也钉住）"
    enforcer: "world-core/tools/spec_bridge.py --self-test（正控：完好沙盒每条判据全绿；对照：『不应红』不得误伤）"

artifacts:
  - id: proposal
    generates: proposal.md
    description: "变更请求（CR/FC）：为什么改、改什么、不改的后果、档位与敏感路径判定"
    template: proposal.md
    instruction: |
      本件＝本次改动的**变更请求**，**就是这一份**：不另写一张申请单，也不在别处留指针。
      字段集参照流程侧变更申请单的要素（为什么改／改什么／档位／影响面），要素落在本件里。

      **变更号独占文档头的 `CR:` 一行**（`templates/proposal.md` **标题之下的第 3 行**——第 2 行是空行；**不是**一张属性表）；普通变更形如 `CR: WC-CR-007`，**框架变更同样是 `CR:` 前缀**、只是号的族不同，形如 `CR: WC-FC-2026-003`（**不写 `FC:` 前缀**）。
      这个号要与 change 目录名一致（`cr-007-<slug>`）。**号由人给，agent 不自己编号。**

      必填节：
      - **Why**：为什么改。必须写清**不改的后果**——这是判「一件事还是两件事」的唯一判据
        （「若两处改动的不改的后果不同，就是两个变更」）。
      - **What Changes**：改什么。要具体到能力／文件／行为。破坏性变更标 **BREAKING**。
      - **Capabilities**：新增／修改哪些能力，对应 `specs/<capability-path>/spec.md`。
      - **档位判定**：A 档还是 B 档。三条判据全不命中才可 A 档：① 没有第二个人需要交接
        ② 没有外部交付物或验收责任 ③ 失效后果可接受。走 GitHub PR 一律按 **B 档**。
      - **评审档位**：R4 还是 R5。判据：**触及契约／门禁／工具／工作流 → 框架变更 → R5**；
        否则 R4。把命中的敏感路径逐条列出（`openspec/specs/**`、`openspec/config.yaml`、
        `tools/**`、`.github/workflows/**`、`.scope-declaration.json`）。
      - **Impact**：受影响面。
      - **让路三要素**（**经验 §一**）：本件只要有一处「不按书来」的处置，就必须写全
        **让的是哪一条**（`path:line` ＋逐字引文）／**为什么要让**／**谁批的**。
        **半写＝不写**——`world-core/tools/spec_bridge.py` 判据⑦ 按**件整体**核三要素齐不齐。
        没有让路处置时，本栏写「无」，**不许省掉栏位**。

      若判定为 R5，本件同时充当**框架变更申请单**：必须带触发条件编号（FC-1…FC-6）
      与**现象证据**。FC-6（个人偏好类「我觉得这样更优雅」）一律驳回。

      保持 1–2 页。重点是「为什么」，「怎么做」归 design。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: "需求增量：### Requirement: <从流程侧取的号> 标题（取不到写「无号·待增补」），每条带可复现的验收场景与证据行"
    template: spec.md
    instruction: |
      这是**需求增量**。本仓的规格树是需求内容的**机读权威载体**；流程侧的 SRS 与 RTM
      是同一批需求的**文档形态与追溯面**——两边**靠编号对齐，不复制内容**。

      **编号是主键。** 每条 `### Requirement:` 的标题**从流程侧取号**开头：

          ### Requirement: REQ-F-012 单笔上限校验

      号从流程侧取（SRS / RTM 已在用的号），**永不复用、废弃留行、写全左补零**
      （`REQ-F-012` 不写 `REQ-F-12`）。**取不到号时登记为「无号·待增补」，不许自造、不许拿相近号硬凑**。

      **每条 Requirement 至少一个 Scenario**，且每个 Scenario 必须用**恰好四个 `#`**。
      每条 Scenario 末尾必须有证据行：

          - **证据**：`path/to/test_file::test_name`（或 `tools/x.py --self-test`）

      证据行的测试名必须是**真实存在**的。OpenSpec 的 `validate` 不校验这一点，
      由项目自建的 `spec_bridge.py` 补上存在性校验——否则它会随时间失效。

      **证据行的两条形态硬规矩**（`spec_bridge.py` 判据② 会红）：
      - 那一行**必须自带反引号包起来的 token**；还没有断言的条目改用
        `- **证据（待补）**：` 并写明落点——**用「证据」这个标记而不给 token，形态上等于声称存在**；
      - 长得像位置的 token（带 `/` 或 `.rs`／`.py`／`.sh`／`.md` 后缀或 `::`）会被**核存在性**，
        所以要么给**可解析的路径**，要么别写成路径样（行文强调不追存在性）。

      四个操作头（delta 语义）：
      - `## ADDED Requirements` 新增
      - `## MODIFIED Requirements` 改行为，**必须带全存活 Scenario**（不许只贴改动部分）
      - `## REMOVED Requirements` 必须带 **Reason** 与 **Migration**
      - `## RENAMED Requirements` 只改名，用 FROM:/TO:

      新能力才写 `## Purpose`（≥50 字）；已有能力不要写，它已有 Purpose。

      **只装「已成立且可复现」的行为。** 未定的、待裁的、已知残余风险，
      一律写进 `design.md` 的**排除清单**，不要写进规格——否则就是把未定当已定。

      **改规格之后的连带动作**（经验 §八）：改了规格树或生成输入，**必须重跑生成链**
      `python openspec/gen/gen_specmap.py` → `python openspec/gen/gen_secmap.py` → `python openspec/gen/gen_bridge_md.py`
      （**三步、顺序不能错**；⚠ 中间那步 `gen_secmap.py` 不许省——判据⑬ 核 `openspec/generated/节对齐.md`
      首部记下的 `openspec/generated/specmap.json` 哈希是否＝当前值，「specmap 重跑过、secmap 没跟着重跑」一律红，
      且**只补跑 bridge 不消除它**）；
      新能力的 Requirement 还要在 `openspec/generated/BRIDGE.md` 的「在册」面里出现
      （判据④ 按**标题逐字**核规格树下的每一条——**漏一条即红**）。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: "影响分析 + 回归范围 + ≥2 方案（含不改案）+ 原子表 + 排除清单 + L5 覆盖边界"
    template: design.md
    instruction: |
      本件是本次 change 的设计件。其中「影响分析」与「方案对比」两节的**填法**按流程侧 R5
      的要求（那两条是流程的经验，内容随流程），**载体就是本件**——不另写一份影响分析。

      必填节：

      - **Context**：塑造做法的现状与约束。不要重述 proposal 的动机。
      - **Goals / Non-Goals**：本设计要达到什么、明确排除什么。
      - **影响分析**（R5 准入要件）：
        - 受影响的**模块**；
        - 受影响的**需求**（列 REQ 号）；
        - **需重跑哪些测试**；
        - **回归范围可推导**：按 R-A / R-B / R-C / R-D 给出；
        - **工作量估算**；
        - **需通知的使用方**（破坏性变更必须通知全部使用方；无则写「无」）。
      - **方案对比（≥2 个，必须含「不改」或「最小改」案）**：
        这是 R5 的★准出项，缺一个就驳回。每案写：做什么／代价／为什么选或不选。
      - **原子表**（**最小原子化落地处**，`WC-ATOM-001` §四；**本档与 `opsx-swe-gb` 的主要差别之一**）：
        **每个新增或改动的原子一行**，**栏数以 `templates/design.md` 的表头为准**（原子／intent／四件同夹／deps == import／生成物／机核读数），**逐栏非空**：

        | 原子（真实路径） | intent（一句话，出现「与／和／及」并列两事即拆） | 四件同夹（契约／实现／测试各在哪） | deps == import（声明依赖 ≡ 代码里真实 use） | 生成物（有则写重跑命令；无则写「无」） | 机核读数（贴命令与原始输出） |

        **A-1**：`intent` 说不清或并列两事 ⇒ 这个原子要拆。
        **A-2**：契约＋实现＋测试**同夹**；本仓 `tests/` 与 `src/` 不同夹时，按「可指认」判——
        三件都要写出**真实路径或用例名**，不许写「在测试里」。
        **A-4**：`deps` 必须**逐边等于**代码里真实的 `use`；有向图必须无环。
        机核执行者：`python world-core/tools/module_graph.py`。
        **本表不是宣言**：写「无环」而没有跑过那个命令，就等于把没做到写成做到了。
      - **Decisions**：定下来的技术选择与理由。
      - **Risks / Trade-offs**：`[风险] → [缓解]` 逐条。
      - **排除清单**：**明确不写进 specs 的东西，逐条给出处**。未定项、待人裁项、
        已知残余风险都放这里。这一节是本档位与普通 OpenSpec 最大的差别之一——
        它让「哪些是已定的」与「哪些不是」在同一份材料里可核。
      - **L5 覆盖边界**（**书 L5 那一层的落点**）：**「规格已定、只是今天没做到」的东西放这里**——
        逐条给：① **书里的判据出处**（章·节名；**不写行号**——行号会烂）② **今天的实测读数**（红／绿，带命令与输出）
        ③ **为什么还没做到** ④ **落点**（哪个 change、或 `tasks.md` 第几组）。
        **这一节不得被读成「能力已成立」**——它登记的正是「还没成立」。
        与「排除清单」的分界：**能判红绿的进本节**（规格已定、只是没做到）；
        **判不了红绿的进排除清单**（规格本身还没定）——这就是书的 L5 与 L6 的分界。
      - **Migration Plan**：落地步骤与回滚策略。
      - **Open Questions**：可以延后定、且不影响规格／做法／任务拆分的问题。

      若本件是为 R5 而写：**触发条件编号（FC-1…FC-6）与现象证据**必须写在影响分析里。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: "实施与验证步骤，每条自带完成判据与会红的变异点"
    template: tasks.md
    instruction: |
      写任务前先看 `design.md` 的 Open Questions：凡会改变「要造什么」的，先与人定，
      不要把没写出来的假设烤进任务表。

      **严格遵守复选框格式**：`- [ ] X.Y 任务描述`。只有 `x`（大小写、空格不限）算完成；
      `- [~]` / `- [-]` / `- []` 一律算未完成；没有复选框的行不被跟踪。

      规矩：
      - 按依赖分组，`## 1.` `## 2.` 编号；**最后一组固定是 `## 3. 验证与取证`**——集成检查只放那一组；
      - **每条任务自带验收方式**（一条测试、一条命令、一个可观察行为、或一件交付物），
        写在该条的描述里。只有跨多个任务的整体验证才单独成条；
      - **每组自带该组该有的测试与文档**，不许把测试与文档堆到最后一组——
        最后一组只放集成检查；
      - 单条任务小到能一次会话做完。

      **★ 断言类任务必须带「变异怎么变红」栏**（经验 §五：**没有反例的判据是装饰**）：
      - 一判据一反例；
      - **反例必须与真实违规同形态**（只认带 `#` 的标题式、而实盘违规全是加粗式／表格式 ⇒ 判据永远绿）；
      - **不许取「文件里第一处字样」**：按栏位形态取，有几处就查几处；
      - 反例**不许互相污染**（夹具被前一个反例删掉，后面的反例就变成假绿）；
      - **还要有正控**：把「不该红的」也钉住。
      写不出变异点的断言类任务**不算完成**——它证明不了自己会红。

      **★ 原子纪律**：本件的每条任务都要能指回 `design.md` 原子表里的**一个原子**；
      任务做完一条勾一条，**勾之前先跑那条验收命令**。
      **原子类任务额外给两样**：① `python world-core/tools/module_graph.py` 的读数
      （deps == import 且无环）② 该原子的测试用例名（四件同夹的第三件）。

      **归档**要求 tasks 全勾——⚠ **但归档那一刻没有任何东西会拦你**：实测 `archive --yes`
      在 tasks 未全勾时仍 `rc=0` 并**已把 delta 合并进主规格**。全勾这一条由**事后**的
      `openspec validate --archived` 复查（它只查勾，是 lint）。**若某条本来就做不完（常设维护项），
      不要留在本件里**——它会让那份事后 lint 永久报 `N incomplete tasks`，红了要回退。
      常设项写进项目自己的维护清单。

      任务写在实施前，状态随实施更新。规格说做什么，design 说怎么做，本件说分几步。
    requires:
      - specs
      - design

  - id: review
    generates: review.md
    description: "R4/R5 评审记录与签字。R5 前置（方向批准）；R4 后置（实施完成后、归档前）"
    template: review.md
    instruction: |
      本件是**评审与签字那道闸**。OpenSpec 本身没有角色概念（它允许 agent 自己
      propose → apply → archive）；评审与签字是**流程侧的经验**（R0–R8、执行者不能是唯一批准者）。
      按分工判据它归流程，而**载体落在本 change 上**——不另立册子、不设双份登记。

      **两个档位的时机不同，这是本工作流的硬约定：**

      - **R5（框架变更评审）＝ 前置闸。** 准入是「变更申请单 + 影响分析已完成」，
        而这两样就是 `proposal.md`（含 FC-1…FC-6 触发条件与现象证据）与
        `design.md`（含 ≥2 方案对比、含「不改」案）。**未获 R5 批准不得进入实施。**
        本件的 R5 节在 apply 之前填、签字。
      - **R4（模块评审）＝ 后置闸。** 准入是「模块代码已提交（含单元测试），附提交号；
        详细设计说明中该模块章节已更新」——**代码没写完就没什么可审的**。
        所以本件的 R4 节在 apply 之后、**归档之前**填、签字。

      因此：**归档时没有任何东西会拦你**（`openspec archive` 不读本件、也不读 tasks 的勾）。
      真能拦的是 `spec_bridge.py` 判据①（归档目录必须有本件）与判据⑥（本件已签：结论栏已填、批准人非空），
      而**它必须由人在归档前跑一次**才起拦阻作用。
      实测（tasks 未全勾、本件未签时）：`openspec archive --yes` 仍 `rc=0`，且**已把 delta 合并进主规格**。
      ⇒ 口径只有一条：**`archive` 不是门禁**；`spec_bridge.py` 与 `validate --archived`
      是**归档前必须跑一次／归档后复查**的两处，**红了就回退**，别当成「归档动作自带闸」。
      跑法：`python world-core/tools/spec_bridge.py`（本机命令名是 `python`，不是 `python3`）。
      另：**未签的本件不算已归档**——判据⑥ 读结论栏与批准人栏，未签／占位一律判红。
      必填：
      - **变更号与档位**：CR/FC 号，R4 还是 R5；
      - **提出人 / 影响分析人 / 批准人 / 结论 / 日期**——这**五格**都要有真实标识（**这是签署面的五个格，不是本件的全部栏位**；其余必填栏位见 `templates/review.md`）；
      - **执行者与批准者的分离声明**：写明二者不同人。同一人兼任时（仅 A 档允许），
        必须写明「换身份复核」的方式；
      - **R4 准出逐项**：接口契约符合 / 覆盖率（行 ≥80%、核心分支 ≥90%，裁剪须声明）/
        正常·边界·异常·空值四类路径 / 无遗留 P0-P1 / 单元测试全过 / 无新增循环依赖 /
        框架适配性回判已执行 / 设计文档与代码无漂移 /
        至少 1 名同级开发完成代码走查并签字；
      - **R5 准出逐项**：触发条件成立（**FC-6 个人偏好一律驳回**）/
        ≥2 方案对比含不改案 / 影响范围明确且回归范围可推导 / 破坏性变更已通知全部使用方 /
        批准后有确定的新框架版本号 / **驳回的变更已记入技术债清单（驳回 ≠ 删除）**；
      - **环境指纹**：验收在哪台机器、什么版本上跑的。**只在本地跑过、无法复现的结果
        不作为门禁依据**；
      - **结论**：**R4 ＝ 通过 / 有条件通过 / 退回；R5 ＝ 批准 / 驳回**（两档不许混，出处 `附件三-评审与门禁.md` 的「结论形式」列）。
      - **必填栏位（模板已补，逐栏见 `templates/review.md`）**：主持人 / 必参（含**测试**席位，「缺测试参与的评审无效」）/ 逐条评审记录（含 `证据类型` EV-11a·EV-11b）/ **本档不能证明的事** / **「技术内容已被评审并给出裁定」＝独立准出项**（与「格式齐备」分列两条，只有前者不算过）/ **H-14 追认登记表** / 环境指纹。

      **★ 两栏本档特有的必填**（经验 §五／§七）：
      - **判据有效性登记**：本件所依赖的每条机器判据，逐条写「它为什么可能失败」。
        **自证通过 ≠ 判据有效**——造完反例要**去实盘跑一遍**，看它到底抓到了什么。
      - **本档不能证明的事**：与签字同栏写清能力边界。**不许**把本件读成万能背书。

      **签字与责任归属归人，不可代签。** 本件由人填；agent 只能准备材料、跑门禁、贴原始输出。
      **引用纪律**：证据写「命令 ＋ 步骤名／用例名」，**不写行号**（行号会烂）；
      标了「逐字」的引文**一字不差**（不许在引文里自己加粗或删节）。

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    **实施前先确认方向已批准：**
    - 若本 change 判定为 **R5**（触及契约 / 门禁 / 工具 / 工作流），
      `review.md` 的 R5 节必须已签「批准」——**未批准的框架变更不许进入实施**；
    - 若判定为 **R4**，方向无需单独批，直接实施。

    然后按 `tasks.md` 逐条做，做完一条勾一条。**勾之前先跑那条的验收命令**——
    「读起来做完了」不算完成。代码改动必须过 `world-core/tools/scope_check.py`：
    越出 `world-core/.scope-declaration.json` 声明的范围即 rc=1。

    **原子化在实施中的两条纪律**（`WC-ATOM-001` §四）：
    - 一个原子一个夹：契约（规格条目／接口契约册）＋实现（`src/**`）＋测试（`tests/**`）
      三者都要有落点；`deps` 必须**逐边等于**代码里真实的 `use`。
      ⚠ **说清边界**：`python world-core/tools/module_graph.py` 读的是 `WC-MODREG-001` 登记表，
      **它不看 `design.md` 的原子表** ⇒ 原子表与那个机核之间是**人工对号**，不是自动连接；
      **有环即停**，不许先合入再修。
    - 生成物**一律重跑生成器**，不许手编；改了源而没重跑，`spec_bridge.py` 判据⑪／⑫／⑬ 会红。

    **实施完成后、归档之前**，补 `review.md` 的 R4 节并取得签字
    （代码走查人 + 批准人，执行者不得为唯一批准者）——缺本件，判据①／⑥ 会红。

    **收口顺序（不许跳步）**：跑齐三条门禁 ⇒ 请独立评审 ⇒ **由作者签** ⇒
    **归档前**跑一次 `python world-core/tools/spec_bridge.py`（判据①⑥ 是这里唯一会拦的两条）⇒ 归档 ⇒
    归档后复查 `openspec validate --archived` 与 `python world-core/tools/spec_bridge.py`，红了回退。
    **别把 `openspec archive` 当闸**——它不拦。
    遇到阻塞停下来问，不要绕过。
