name: opsx-swe-gb-atom
version: 1
description: "项目级 OpenSpec 工作流（原子档）：在 opsx-swe-gb 之上把两样东西落成可核的落点—— WC-ATOM-001 的最小原子化（单意图／一个原子一个夹／deps == import 且无环／生成物不手编／UTF-8 无 BOM）与这一程踩过的经验（让路三要素、文档集封闭、判据必须会红、一个事实一个权威载体、闸必须在版本控制内、索引按结构取不按字样第一次出现取、并发双坐标）。产物链仍是 OpenSpec 的五件：proposal → specs ∥ design → tasks → review；【原子表】是 design 件的必填栏位（模板 `templates/design.md`），【经验表】是本文件自己的 `experience:` 段（**声明哪些经验由哪个执行者管**，**不是**任何产物的栏位）——两样都不另立册子。"

# ── 融合声明：这套 schema 是哪四样东西的合体，各自落在哪一条 ────────────────
# 作者指示（2026-09-28 逐字）：「按照 openspec 整个体系，然后要融入我们国际软件开发这个流程，
# 然后还要融入我们的最小原子化的相关概念。…生成新的我们的相关的 schema…
# 还有一些我们的经验必须也融进去。」
# 每一格都给出**落点**（本文件里哪一条、或仓内哪个权威件）——不许只写名字。
# `delta.also_written_to`：这一格在本档里**另有一份可核载体**（schema 认的产物 ＋ 项目自己的门禁）。
