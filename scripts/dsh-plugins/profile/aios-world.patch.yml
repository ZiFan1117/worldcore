# ★★★ AI-OS profile patch —— ★ 把【跑命令的手】交给本体管
#
# ★ 作者令（逐字）：「tool-bash／tool-pwsh／先改这个」
#
# ★ 本步只关【两个】（★ tool-fs 【放开】—— ★ 读／写／改文件仍然要用）：
#   · tool-bash  → DSH 的 `bash` 工具（跑 shell 命令）
#   · tool-pwsh  → DSH 的 `pwsh` 工具（跑 PowerShell）
#
# ★ 关掉后：“跑一条命令”这类事【只能】经 world_ask ⇒ 本体（认名字／判许可／盖章／记账）⇒ 载体执行
# ★ 仍然保留（★ 都不跑 shell）：
#   · tool-fs         read／write／edit／read_image —— ★ 读写文件
#   · tool-fs-search  glob／grep                    —— ★ 找文件
#   · world_query／world_ask／world_ui               —— ★ 我们的三件（全过本体）

# ── 关两个 ────────────────────────────────────────────────
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# ── 挂我们的世界插件 ──────────────────────────────────────
- insert:
    - id: aios-world
      name: 'dsh-plugin-aios-world'
