[package]
name = "world-core"
version = "0.1.0"
edition = "2021"
description = "世界核心（World Core）—— 语义事件是唯一真相"
license = "MIT OR Apache-2.0"

# 依赖纪律（见 SCMP §四 配置项清单与 SDP §3.6 K-01）：
#   **只允许 `serde_json` 一个 crate family**——账本与本体都是纯文本 JSON。
#   禁止语言专有二进制序列化（那会让"换语言 = 世界归零"）。
#   不引入 serde_yaml（已归档停更）、不引入 uuid/chrono（用标准库自己算）。
[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

