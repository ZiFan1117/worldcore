name: 世界核心 门禁
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
env:
  PYTHONIOENCODING: utf-8
  RTM_STRICT: 'false'
jobs:
  smoke:
    name: L0 骨架冒烟（S3 门禁：一条命令跑通）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: 格式检查
      run: cargo fmt --all -- --check
    - name: 静态检查（警告即失败）
      run: cargo clippy --all-targets -- -D warnings
    - name: 构建
      run: cargo build --locked
    - name: 骨架冒烟 —— 必须打印 READY
      run: "rm -f ci-smoke.jsonl ci-smoke.lock\nout=$(cargo run --quiet -- --ledger ci-smoke.jsonl check)\necho \"$out\"\necho \"$out\" | grep -q READY\n# ── 新账本必须带摘要链（WC-SCMP-001 变更请求台账 · WC-CR-003）──\n# 此前只有 VM 侧的 check.sh 在盯这件事；CI 也盯上，它才真正是被强制的。\n# ⚠ 写进世界的东西**必须在出厂本体里声明过**（书 §5.3「声明以外的东西不许落账」；\n#   执行者 `src/ontology_definition/mod.rs::check_concepts`）。本行原写 `world://ci/probe` ＋ `p`——\n#   两个名字都没声明过 ⇒ append rc=2，紧接着的 `grep -q '有摘要链'` 必失败（**CI 的 smoke 作业曾因此常红**）。\n#   改成已声明的格子（`notice.muted` 是 `bool`，故 `after` 取 `true`）；\n#   这一步要的只是「写一条 → 断言账本带链 → `--require-chain` 过」，判据强度不变。\ncargo run --quiet -- --ledger ci-smoke.jsonl append change \\\n  '{\"subject\":\"world://notice/probe\",\"path\":\"muted\",\"before\":null,\"after\":true}' > /dev/null\nout2=$(cargo run --quiet -- --ledger ci-smoke.jsonl check)\necho \"$out2\"\necho \"$out2\" | grep -q '有摘要链' || { echo \"::error::新账本未带摘要链（WC-SCMP-001 变更请求台账 · WC-CR-003）\"; exit 1; }\ncargo run --quiet -- --ledger ci-smoke.jsonl --require-chain check\
        \ > /dev/null\necho \"摘要链：新账本带链，--require-chain 通过\"\n"
    - name: 系统级验收 —— TC-037–TC-040（真实二进制端到端）
      run: '# ⚠️ 先自证判定器会红（"一个从不失败的检查不是检查，是装饰"）

        bash scripts/test/system_acceptance.sh --self-test

        # 再跑 4 条系统级用例：只追加/无第二条写路径、信封 8 必填字段与版本、

        # 状态=账本投影（含反假断言）、本体缺失·损坏·版本不符三拒启

        bash scripts/test/system_acceptance.sh

        '
  unit-test:
    name: L1 单元 + 验收测试（S4 门禁）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: 全量测试
      run: cargo test --locked --verbose
  gate-self-test:
    name: 门禁工具自测（scripts/verify/ 判据）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 确认 CI 自身没有被 continue-on-error 削弱、且必需作业齐备
      run: python scripts/verify/ci_self_check.py
    - name: 范围声明必须是合法 JSON 且非空
      run: 'python -c "import json,sys; d=json.load(open(''.scope-declaration.json'',encoding=''utf-8'')); sys.exit(0 if d.get(''allowed'') else 1)"

        '
    - name: 纯文本审计（REQ-N-001 / AC-07；先自证工具会失败）
      run: '# ⚠️ 先自证：**没有反例的自测等于没测**（本项目的老教训）

        python scripts/verify/plain_text_audit.py --self-test

        # 再审真实产物：词表与策略（账本由 smoke 作业在沙箱里产生，不入库）

        python scripts/verify/plain_text_audit.py src/ontology_definition/ontology.json src/gate/policy.json

        '
    - name: 门禁工具可用性（用示例数据自证工具链是通的）
      run: '# ⚠️ 本步只证明"工具链是通的"，**不是**追溯结论：

        # `--sample` = **显式**索取 ninedim/07-待审/_非本项目样例/ 的示例数据

        #（该模式自带跳过模块登记表校验，且结论**不会**写成"覆盖率 100%"）。

        # 真实数据的追溯由 traceability 作业负责（trace_matrix 裸跑默认即真实产物）。

        # ⚠️ 样例数据**不得**在未加 --sample 时被当成输入：那样工具会直接判不通过。

        python scripts/verify/trace_matrix.py --sample

        '
  traceability:
    name: RTM 需求追溯门禁（S1 / S5 / S6）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 校验需求双向追溯完整性
      run: "SRS=\"ninedim/01-意图环/02-需求/需求-WC-SRS-001-v0.1.md\"\nRTM=\"ninedim/01-意图环/02-需求/WC-RTM-001.csv\"\n# 阶段开关（见文件顶部 RTM_STRICT 的说明）：S1–S4 非严格，S5 起严格。\nSTRICT=\"\"\nif [ \"$RTM_STRICT\" = \"true\" ]; then STRICT=\"--strict\"; fi\necho \"追溯门禁强度：RTM_STRICT=${RTM_STRICT}（STRICT='${STRICT}'）\"\nif [ -f \"$RTM\" ]; then\n  python scripts/verify/trace_matrix.py --matrix \"$RTM\" --srs \"$SRS\" $STRICT\nelif [ -f \"$SRS\" ]; then\n  echo \"::error::SRS 已存在但 RTM 缺失 —— S1 未完成，追溯门禁不通过\"\n  exit 1\nelse\n  echo \"::warning::S1 尚未开始（无 SRS/RTM）—— 追溯门禁在 S1 前不适用。\"\n  echo \"::warning::S1 产出 WC-RTM-001.csv 后本作业自动强制生效；不得改为静默跳过。\"\nfi\n"
  scope:
    name: 改动范围门禁（受控变更）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 校验改动是否越界
      run: "python scripts/verify/scope_check.py \\\n  --base origin/${{ github.base_ref }} \\\n  --scope .scope-declaration.json\n"
  openspec-validate:
    name: 规格层形态门禁（python scripts/verify/spec_shape.py）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: 安装 OpenSpec CLI（**版本钉死**，与本机实测的 1.13.2 一致）
      run: npm install -g @fission-ai/openspec@1.13.2
    - name: 形态门禁 —— 结构 / Scenario 恰好 4 个 `#` / delta 语法
      run: 'openspec --version

        python scripts/verify/spec_shape.py

        '
    - name: schema 形态门禁 —— schemas 下的 schema 结构与模板
      run: 'openspec --version

        npx --yes @fission-ai/openspec@1.13.2 schema validate opsx-swe-gb-atom

        '
  spec-bridge:
    name: 规格层守卫（spec_bridge.py）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 守卫先自证会红（反例不变红 ⇒ 该守卫是装饰，拒绝合入）
      run: python scripts/verify/spec_bridge.py --self-test
    - name: 规格层守卫（逐条判据与条数以 --json 的 passed/failed 为准）
      run: python scripts/verify/spec_bridge.py
  module-graph:
    name: 原子化机核（A-1 单意图／A-4 deps==import 且无环／A-2 四件同夹）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 机核工具必须在本次签出里（缺席即**显式**报错，不得静默跳过）
      run: "if [ ! -f scripts/verify/module_graph.py ]; then\n  echo \"::error::scripts/verify/module_graph.py 不在本次签出里 —— WC-ATOM-001-v0.1.md §二 A-4「deps == import 且无环」今天就没有执行者\"\n  exit 1\nfi\nls -l scripts/verify/module_graph.py\n"
    - name: 机核先自证会红
      run: python scripts/verify/module_graph.py --self-test
    - name: 机核 —— 三条判据（逐条给会红的断言）
      run: python scripts/verify/module_graph.py
