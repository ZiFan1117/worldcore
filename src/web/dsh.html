<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DeepSeek Harness · worldcore</title>
<style>
:root{
  --bg:#fff; --side:#f7f7f8; --line:#e8e8e8; --text:#1a1a1a; --muted:#8b8b8b;
  --accent:#4d6bfe; --accent-soft:#eef2ff; --bubble:#f4f4f5; --card:#fafafa;
  --green:#1a7f37; --red:#c0392b; --code:#f6f6f7;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#141414;--side:#1b1b1b;--line:#2b2b2b;--text:#ececec;--muted:#9a9a9a;
    --accent:#7c93ff;--accent-soft:#1d2440;--bubble:#242424;--card:#1e1e1e;
    --code:#111;--green:#4ade80;--red:#f87171}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.app{display:flex;height:100vh;overflow:hidden}
/* ── left ── */
.side{width:266px;flex:0 0 266px;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.titlebar{height:34px;display:flex;align-items:center;gap:16px;padding:0 14px;
  font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);flex:0 0 34px}
.titlebar b{font-weight:500;color:var(--text)}
.brand{padding:16px 16px 12px;display:flex;align-items:center;gap:9px}
.whale{width:26px;height:26px;color:var(--text);flex:0 0 26px}
.brand .name{font-weight:700;font-size:16px;letter-spacing:-.3px}
.brand .badge{font-size:9px;letter-spacing:.12em;border:1px solid var(--line);border-radius:4px;
  padding:2px 4px;color:var(--muted);margin-left:1px}
.newchat{margin:0 12px 8px;height:34px;border:1px solid var(--line);background:var(--bg);
  border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:12.5px;color:var(--text)}
.newchat:hover{background:#fff}
.side .nav{padding:2px 8px}
.navitem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:7px;
  font-size:12.5px;color:var(--text);text-align:left}
.navitem:hover{background:rgba(0,0,0,.04)}
.navitem .ic{width:15px;text-align:center;color:var(--muted);font-size:13px}
.grp{padding:18px 16px 4px;display:flex;align-items:center;gap:7px;color:var(--muted);
  font-size:11px;letter-spacing:.04em}
.grp .ops{margin-left:auto;display:flex;gap:10px;font-size:13px;color:var(--muted)}
.ws{padding:2px 8px;overflow:auto;flex:1;min-height:0}
.wsrow{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;
  font-size:12.5px;color:var(--text)}
.wsrow:hover{background:rgba(0,0,0,.04)}
.wsrow .fold{color:var(--muted);font-size:12px;width:13px;text-align:center}
.wsrow .age{margin-left:auto;color:var(--muted);font-size:10.5px;white-space:nowrap}
.wsrow.active{background:rgba(0,0,0,.055)}
.wsrow.active .t{font-weight:500}
.wsrow .badge{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;
  padding:0 4px}
.wsrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  color:var(--muted);font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;background:#bbb;flex:0 0 6px}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
/* ── main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.head{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:16px;padding:0 20px;
  border-bottom:1px solid var(--line)}
.head .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:360px}
.chips{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:11.5px;margin-left:auto}
.chip{display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip .ci{font-size:12px;color:var(--muted)}
.chip b{font-weight:500;color:var(--text)}
.tabs{height:38px;flex:0 0 38px;display:flex;align-items:flex-end;gap:22px;padding:0 24px;
  border-bottom:1px solid var(--line)}
.tab{position:relative;padding:6px 0 9px;font-size:12.5px;color:var(--muted)}
.tab.on{color:var(--accent);font-weight:600}
.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
  border-radius:2px 2px 0 0}
.tab.cc{color:var(--muted)}
.view{flex:1;min-height:0;overflow:auto}
.view .inner{max-width:880px;margin:0 auto;padding:26px 28px 20px}
/* conversation */
.msg{display:flex;margin:0 0 18px}
.msg .who{display:none}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--bubble);border-radius:14px;padding:9px 13px;max-width:76%;
  white-space:pre-wrap;overflow-wrap:anywhere}
.msg.agent .bubble{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.msg.agent .bubble p{margin:0 0 8px}.msg.agent .bubble p:last-child{margin:0}
.msg.agent .bubble b{font-weight:600}
.msg.agent .bubble code{background:var(--code);border-radius:4px;padding:1px 4px;font-size:12px}
.msg .meta{display:none}
.intro{color:var(--text)}
.roleline{display:flex;align-items:center;gap:8px;margin:2px 0 10px;color:var(--muted);font-size:11px}
.roleline .avatar{width:18px;height:18px;border-radius:5px;background:var(--text);color:var(--bg);
  display:grid;place-items:center;font-size:10px;font-weight:800}
.tool{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;
  margin:0 0 10px;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.tool:hover{border-color:var(--accent)}
.tool .ti{width:19px;height:19px;border-radius:5px;background:var(--bubble);display:grid;
  place-items:center;color:var(--muted);font-size:11px;flex:0 0 19px;margin-top:1px}
.tool .th{font-size:12px;color:var(--text)}
.tool .th b{font-weight:600}
.tool .ts{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:650px}
.tool .td{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;
  font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);white-space:pre-wrap;
  max-height:180px;overflow:auto}
.tool.open .td{display:block}
.filecard{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 16px;
  display:flex;gap:10px;align-items:flex-start;background:var(--bg)}
.filecard .fi{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:12px;flex:0 0 26px}
.filecard .fh{font-size:12px;font-weight:600}
.filecard .fh .pm{font-weight:500;font-size:10.5px;color:var(--green);margin-left:7px}
.filecard .fl{margin-top:5px;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:11px}
.filecard .fp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:700px}
.toolsum{color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);margin:12px 0 0;
  padding-top:10px}
.toolsum b{font-weight:500;color:var(--text)}
/* trace */
.trace{max-width:880px;margin:0 auto;padding:22px 28px}
.tr{border-left:2px solid var(--line);padding:0 0 16px 16px;margin-left:4px;position:relative}
.tr:before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:2px solid var(--muted)}
.tr.observe:before{border-color:var(--green)}.tr.plan:before{border-color:#d29922}
.tr.action:before{border-color:var(--accent)}.tr.render:before{border-color:#a78bfa}
.tr .tt{font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.tr .tm{margin-left:auto;color:var(--muted);font-size:10.5px;font-weight:400}
.tr .tb{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
/* composer */
.composer{flex:0 0 auto;padding:0 28px 14px;background:var(--bg)}
.compbox{max-width:880px;margin:0 auto;border:1px solid var(--line);background:var(--bg);
  border-radius:13px;padding:9px 10px 7px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.compbox:focus-within{border-color:#c9c9c9}
.compbox textarea{width:100%;border:0;outline:0;resize:none;background:transparent;
  min-height:44px;max-height:180px;font-size:13px;line-height:1.6;padding:1px 2px}
.comptools{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:4px;background:var(--bg)}
.cbtn:hover{color:var(--accent);border-color:var(--accent)}
.cbtn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.cspacer{flex:1}
.model{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:4px 6px}
.model b{font-weight:500;color:var(--text)}
.send{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;
  display:grid;place-items:center;margin-left:4px}
.send:disabled{opacity:.4}
.hint{max-width:880px;margin:5px auto 0;color:var(--muted);font-size:10.5px;
  display:flex;justify-content:space-between;gap:8px}
/* login */
.login{position:fixed;inset:0;background:rgba(0,0,0,.38);display:grid;place-items:center;z-index:20}
.login .card{width:340px;background:var(--bg);border:1px solid var(--line);border-radius:14px;
  padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.login .wh{width:26px;height:26px;margin-bottom:8px}
.login h2{margin:0 0 3px;font-size:17px}.login p{margin:0 0 13px;color:var(--muted);font-size:12px}
.login input{width:100%;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text);outline:0}
.login input:focus{border-color:var(--accent)}
.login .err{color:var(--red);font-size:11.5px;margin-top:5px}
.login .go{width:100%;margin-top:10px;background:var(--accent);color:#fff;border-radius:8px;
  padding:8px;font-size:12.5px}
.hidden{display:none!important}
@media(max-width:900px){.chips{display:none}.side{width:224px;flex-basis:224px}}
@media(max-width:680px){.side{display:none}.view .inner,.trace{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="titlebar"><b>应用</b><span>编辑</span></div>
    <div class="brand">
      <svg class="whale" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 16c3.2-4.3 7-6.2 11-5.7 3.3.4 5.4 2 7.5 2.2 1.3.1 2.4-.4 3.5-1.6-1.1 3.8-3.4 5.9-6.4 6.2-2.3.2-4-.7-5.5-.2-1.8.6-2.3 2.6-4 3.7-2.2 1.4-5 1-6.1-1.5" />
        <path d="M4.7 18.5c2.4 3.4 6.4 4.6 10.6 3.3 2.2-.7 3.9-2 5.3-3.7" />
        <circle cx="12" cy="15.2" r=".9" fill="currentColor" stroke="none"/>
      </svg>
      <span class="name">deepseek</span><span class="badge">HARNESS</span>
    </div>
    <button class="newchat" id="newChat"><span style="font-size:15px">＋</span> 新会话</button>
    <div class="nav">
      <button class="navitem"><span class="ic">◇</span> 插件</button>
      <button class="navitem"><span class="ic">◷</span> 自动化任务</button>
    </div>
    <div class="grp">工作区 <span class="ops"><span>⌕</span><span>＋</span></span></div>
    <div class="ws">
      <div class="wsrow"><span class="fold">▸</span><span class="t">worldcore</span></div>
      <div class="wsrow active"><span class="fold"></span><span class="t" id="sessTitle">与 DSH 的对话</span><span class="age">刚刚</span></div>
      <div class="wsrow"><span class="fold"></span><span class="t">DSH Agent 工作台</span><span class="age">今天</span></div>
      <div class="wsrow"><span class="fold"></span><span class="t">智能体控制台</span><span class="age">今天</span></div>
      <div class="wsrow" style="margin-top:6px"><span class="fold">▸</span><span class="t">Code</span></div>
      <div class="wsrow"><span class="fold"></span><span class="t">worldcore 语义世界</span><span class="age">13 天</span></div>
      <div class="wsrow"><span class="fold"></span><span class="t">DSH 界面与 agent 优化</span><span class="age">2 天</span></div>
    </div>
    <div class="sidefoot"><span class="dot" id="dot"></span><span id="footState">DSH · 正在连接</span></div>
  </aside>

  <main class="main">
    <div class="head">
      <div class="title" id="headTitle">与 DSH 的对话</div>
      <div class="chips">
        <span class="chip"><span class="ci">◈</span> 智能体团队</span>
        <span class="chip"><span class="ci">◐</span> 标准模式</span>
        <span class="chip"><span class="ci">◎</span> <b id="agentCount">1</b> 个智能体</span>
        <span class="chip"><span class="ci">●</span> <b id="agentChip">待启动</b></span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-view="chat">对话</button>
      <button class="tab" data-view="trace">轨迹</button>
    </div>
    <div class="view" id="chatView"><div class="inner" id="thread"></div></div>
    <div class="view hidden" id="traceView"><div class="trace" id="trace"></div></div>

    <div class="composer">
      <div class="compbox">
        <textarea id="input" rows="2" placeholder="给 DSH 发消息，或让它去做一件事…"></textarea>
        <div class="comptools">
          <button class="cbtn" id="btnLaunch"><span>▶</span> 启动 Agent</button>
          <button class="cbtn" id="btnGuideMode"><span>◇</span> 引导</button>
          <button class="cbtn" data-guide="先看世界状态、可用动作和最近事件，再决定下一步；不要重复最近动作。">先看世界</button>
          <button class="cbtn" data-guide="用 file.* 只读动作看看 /var/lib/aios 与 /root/aios，找出值得注意的文件。">看文件</button>
          <button class="cbtn" data-guide="用 network.addresses、network.routes、network.connections 检查本机网络。">看网络</button>
          <span class="cspacer"></span>
          <span class="model"><span>◈</span> <b>deepseek-chat</b> <span>⌄</span></span>
          <button class="send" id="send" title="发送">↑</button>
        </div>
      </div>
      <div class="hint"><span>Enter 发送，Shift+Enter 换行；动作与回话都经本体。</span><span id="hintState">就绪</span></div>
    </div>
  </main>
</div>

<div class="login hidden" id="login">
  <div class="card">
    <svg class="wh" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" style="display:block">
      <path d="M5 16c3.2-4.3 7-6.2 11-5.7 3.3.4 5.4 2 7.5 2.2 1.3.1 2.4-.4 3.5-1.6-1.1 3.8-3.4 5.9-6.4 6.2-2.3.2-4-.7-5.5-.2-1.8.6-2.3 2.6-4 3.7-2.2 1.4-5 1-6.1-1.5"/>
      <path d="M4.7 18.5c2.4 3.4 6.4 4.6 10.6 3.3 2.2-.7 3.9-2 5.3-3.7"/>
    </svg>
    <h2>登录 DeepSeek Harness</h2>
    <p>用 worldcore 身份登录；票由本体发。</p>
    <input id="user" value="zhang" placeholder="用户名"/>
    <input id="pass" type="password" value="0" placeholder="密码"/>
    <div class="err hidden" id="loginErr"></div>
    <button class="go" id="btnLogin">登录</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const els = {
  dot:$("#dot"), footState:$("#footState"), agentChip:$("#agentChip"),
  thread:$("#thread"), trace:$("#trace"), input:$("#input"), send:$("#send"),
  login:$("#login"), loginErr:$("#loginErr"), user:$("#user"), pass:$("#pass"),
  sessTitle:$("#sessTitle"), headTitle:$("#headTitle"), hintState:$("#hintState"),
};
let ws = {agent:{}, steps:[]};
let messages = load("dsh_messages", []);
let sessionTitle = localStorage.getItem("dsh_title") || "与 DSH 的对话";
let busy = false, guideMode = false, view = "chat";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function short(s,n=160){s=String(s??"");return s.length>n?s.slice(0,n)+"…":s;}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
function nowTime(a){a=a||new Date().toISOString();const d=new Date(a);return d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});}

function setStatus(st){
  ws.agent = st || ws.agent || {};
  const a = ws.agent;
  const on = a.state === "running" || a.launched;
  els.dot.classList.toggle("on", on);
  els.agentChip.textContent = on ? "运行中" : (a.state === "idle" ? "待启动" : "—");
  els.footState.textContent = on ? "DSH · 运行中" : "DSH · 待启动";
  if (a.guide) { els.hintState.textContent = "引导：" + short(a.guide, 34); }
  document.querySelectorAll(".chip b")[1] && (document.querySelectorAll(".chip b")[1].textContent = on ? "运行中" : "待启动");
}
function md(s){
  let h=esc(s);
  h=h.replace(/```([\s\S]*?)```/g,(_,c)=>`<code style="display:block;white-space:pre-wrap;padding:7px;margin:6px 0">${c}</code>`);
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  return h.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}
function toolCard(s){
  const act=s.action||"?";
  const body = s.body ? short(String(s.body).replace(/\s+/g," "), 120) : "";
  const detail = JSON.stringify({action:act, params:s.params||null, ok:s.ok, body:s.body||""}, null, 1);
  return `<div class="tool" onclick="this.classList.toggle('open')">
    <span class="ti">›_</span>
    <div style="min-width:0">
      <div class="th">执行了 <b>${esc(act)}</b> ${s.ok===false?"（失败）":""}</div>
      <div class="ts">${esc(body||"已返回")}</div>
      <div class="td">${esc(detail)}</div>
    </div></div>`;
}
function fileCard(steps){
  const files = steps.filter(s=>s.kind==="action" && String(s.action||"").startsWith("file."));
  if(!files.length) return "";
  const paths=[];
  files.forEach(s=>{const p=(s.params||{}).path;if(p&&!paths.includes(p))paths.push(p);});
  return `<div class="filecard"><div class="fi">▤</div><div style="min-width:0">
    <div class="fh">已读取 ${paths.length || files.length} 个文件 <span class="pm">只读 · 经本体</span></div>
    <div class="fl">${paths.slice(0,5).map(p=>`<div class="fp">${esc(p)}</div>`).join("")}</div>
  </div></div>`;
}
function renderThread(){
  const steps = ws.steps || [];
  const actions = steps.filter(s=>s.kind==="action").slice(-10);
  let h = `<div class="msg agent"><div class="bubble intro">你好，我是 <b>DSH</b>。这是你的 worldcore Agent。你可以直接发消息，或让我去做一件事：我的观察、工具动作、结果都会经本体回到这里。</div></div>`;
  messages.slice(-30).forEach(m=>{
    h += `<div class="msg ${m.role==="user"?"user":"agent"}"><div class="bubble">${m.role==="agent"?md(m.text):esc(m.text).replace(/\n/g,"<br>")}</div></div>`;
  });
  actions.forEach(s=>{h += toolCard(s);});
  h += fileCard(steps);
  if(steps.length){
    const last=steps[steps.length-1];
    h += `<div class="toolsum">执行了 <b>${steps.filter(s=>s.kind==="action").length}</b> 个动作，观察 <b>${steps.filter(s=>s.kind==="observe").length}</b> 轮，渲染 <b>${steps.filter(s=>s.kind==="render").length}</b> 帧 · 最近：${esc(last.kind)} ${esc(nowTime(last.at))}</div>`;
  }
  els.thread.innerHTML = h;
  const v=$("#chatView"); v.scrollTop=v.scrollHeight;
}
function renderTrace(){
  const steps=ws.steps||[];
  if(!steps.length){els.trace.innerHTML='<div class="toolsum">还没有轨迹。启动 Agent 并给它一个任务。</div>';return;}
  els.trace.innerHTML=steps.map(s=>{
    let title=s.kind, body="";
    if(s.kind==="observe"){title="观察世界";body=`round ${s.round??"?"} · world_ok=${s.world_ok} · surfaces=${s.screen_count??"?"}`;}
    else if(s.kind==="plan"){title="计划";body=`${s.action||"（不动作）"}${s.why?" — "+s.why:""}`;}
    else if(s.kind==="action"){title="工具动作 "+s.action;body=`ok=${s.ok}\n${s.body||""}`;}
    else if(s.kind==="render"){title="渲染 A2UI";body=`组件 ${s.components??"?"} 个`;}
    return `<div class="tr ${esc(s.kind)}"><div class="tt">${esc(title)}<span class="tm">${esc(nowTime(s.at))}</span></div>
      <div class="tb">${esc(short(body,600))}</div></div>`;
  }).join("");
}
function render(){renderThread();renderTrace();}

async function cmd(payload){
  const r=await fetch("/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  return await r.json();
}
async function ask(action,params){return await cmd({op:"ask",action,params:params||{}});}
async function refreshWorkspace(){
  const r=await ask("agent.workspace");
  if(r.ok && r.result && r.result.body){
    ws=r.result.body; setStatus(ws.agent); render();
  }
  return r;
}
async function refreshState(){const r=await ask("agent.state");if(r.ok&&r.result&&r.result.body)setStatus(r.result.body);return r;}
async function login(){
  els.loginErr.classList.add("hidden");
  const r=await cmd({op:"login",user:els.user.value.trim(),secret:els.pass.value});
  if(!r.ok){els.loginErr.textContent=r.why||"登录失败";els.loginErr.classList.remove("hidden");return;}
  els.login.classList.add("hidden");
  await refreshWorkspace();await refreshState();
}
function setTitle(t){sessionTitle=t;els.sessTitle.textContent=t;els.headTitle.textContent=t;localStorage.setItem("dsh_title",t);}
async function send(){
  const text=els.input.value.trim(); if(!text||busy)return;
  els.input.value=""; els.input.style.height="auto";
  if(messages.length===0) setTitle(short(text,26));
  messages.push({role:"user",text,at:new Date().toISOString()});store("dsh_messages",messages);render();
  busy=true;els.send.disabled=true;els.hintState.textContent=guideMode?"交给本体…":"DSH 正在回…";
  try{
    let r;
    if(guideMode){
      r=await ask("agent.guide",{instruction:text});
      if(r.ok&&r.result&&r.result.body)setStatus(r.result.body);
      messages.push({role:"agent",text:"**引导已交本体**：" + text,at:new Date().toISOString()});
    }else{
      r=await ask("agent.chat",{message:text});
      const body=((r.result||{}).body)||{};
      if(r.ok&&r.result&&r.result.ok)messages.push({role:"agent",text:body.reply||"（空回复）",at:new Date().toISOString()});
      else messages.push({role:"agent",text:"**没回上来**：" + (r.why || (r.result||{}).why || "未知错误"),at:new Date().toISOString()});
    }
    store("dsh_messages",messages);
  }catch(e){messages.push({role:"agent",text:"**网络错误**："+e.message,at:new Date().toISOString()});}
  finally{busy=false;els.send.disabled=false;guideMode=false;$("#btnGuideMode").classList.remove("on");render();await refreshWorkspace();els.hintState.textContent="就绪";}
}
async function launch(){const r=await ask("agent.launch");if(r.ok)els.hintState.textContent="启动已交本体";await refreshState();}
async function guide(text){els.hintState.textContent="发引导…";const r=await ask("agent.guide",{instruction:text});if(r.ok&&r.result&&r.result.body)setStatus(r.result.body);await refreshWorkspace();els.hintState.textContent=r.ok?"引导已交本体":"引导失败";}
function switchView(v){
  view=v;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  $("#chatView").classList.toggle("hidden",v!=="chat");
  $("#traceView").classList.toggle("hidden",v!=="trace");
}
function sse(){
  try{
    const es=new EventSource("/events");
    es.onmessage=ev=>{let d;try{d=JSON.parse(ev.data);}catch(e){return;}
      if(d.type==="event" && !busy) setTimeout(()=>refreshWorkspace().catch(()=>{}),120);
    };
  }catch(e){}
}
function bind(){
  $("#btnLogin").onclick=login;
  $("#newChat").onclick=()=>{messages=[];store("dsh_messages",messages);setTitle("新会话");render();};
  $("#btnLaunch").onclick=launch;
  $("#btnGuideMode").onclick=()=>{guideMode=!guideMode;$("#btnGuideMode").classList.toggle("on",guideMode);els.hintState.textContent=guideMode?"引导模式：下一条交给本体":"就绪";};
  document.querySelectorAll(".cbtn[data-guide]").forEach(b=>b.onclick=()=>guide(b.dataset.guide));
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
  els.send.onclick=send;
  els.input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  els.input.addEventListener("input",()=>{els.input.style.height="auto";els.input.style.height=Math.min(els.input.scrollHeight,180)+"px";});
}
let timer=null;
async function boot(){
  setTitle(sessionTitle);bind();render();sse();
  // ★ 先出登录卡（不让用户面对白屏）；有票/查询自动登录成功后再收起。
  els.login.classList.remove("hidden");
  els.loginErr.textContent="正在经本体登录…";els.loginErr.classList.remove("hidden");
  const q=new URLSearchParams(location.search);
  if(q.get("user"))els.user.value=q.get("user");
  if(q.get("secret"))els.pass.value=q.get("secret");
  const p=await cmd({op:"ping"});
  if(!p.has_ticket){
    if(q.get("user")&&q.get("secret")){await login();}
    else{els.loginErr.textContent="请登录";els.footState.textContent="未登录";return;}
  }else{els.login.classList.add("hidden");await refreshWorkspace();await refreshState();}
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{if(!busy)refreshWorkspace().catch(()=>{});},3000);
}
boot();
</script>
</body>
</html>
