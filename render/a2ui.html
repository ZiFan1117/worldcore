<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AIOS · A2UI 渲染器</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --line:#30363d; --card:#161b22; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { color:var(--accent); }
  header input[type=text] { flex:1; min-width:240px; background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #status { color:var(--dim); padding:6px 16px; font-size:12px; }
  #stage { padding:16px; }
  .a2ui-text { white-space:pre-wrap; }
  .a2ui-text b, .a2ui-text strong { color:var(--accent); }
  .a2ui-column { display:flex; flex-direction:column; gap:10px; }
  .a2ui-row { display:flex; flex-direction:row; gap:10px; align-items:center; }
  .a2ui-list { display:flex; flex-direction:column; gap:6px; }
  .a2ui-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .a2ui-divider { border:0; border-top:1px solid var(--line); margin:8px 0; }
  .a2ui-button { background:var(--accent); color:#0d1117; font-weight:600; border:0; border-radius:6px; padding:7px 14px; }
  .a2ui-input { background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  .a2ui-unknown { color:#f85149; border:1px dashed #f85149; border-radius:6px; padding:4px 8px; }
  .a2ui-icon { font-size:18px; }
  .a2ui-img { max-width:100%; border-radius:8px; }
</style>
</head>
<body>
<header>
  <b>AIOS · A2UI 渲染器</b>
  <input id="src" type="text" value="frame-sample.json" />
  <button id="load">读这个路径</button>
  <button id="drop">拖个 .json 进来</button>
  <button id="demo">看内置样例</button>
</header>
<div id="status">等帧 …</div>
<div id="stage"></div>
<script type="module">
import { fold, plan } from "./a2ui-renderer.mjs";

const stage = document.getElementById("stage");
const status = document.getElementById("status");

const DEMO = { version:"v1.0", name:"内置样例", messages:[
  { version:"v1.0", createSurface:{ surfaceId:"demo", catalogId:"https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json" } },
  { version:"v1.0", updateComponents:{ surfaceId:"demo", components:[
    { id:"root", component:"Column", children:["t1","c1","d1","r1"] },
    { id:"t1", component:"Text", text:"**A2UI 渲染器** 起来了" },
    { id:"c1", component:"Card", child:"c1col" },
    { id:"c1col", component:"Column", children:["c1a","c1b"] },
    { id:"c1a", component:"Text", text:"这一帧是 A2UI v1.0 协议" },
    { id:"c1b", component:"Text", text:"组件按 children / child 组树" },
    { id:"d1", component:"Divider" },
    { id:"r1", component:"Row", children:["b1","b2"] },
    { id:"b1", component:"Button", text:"确定" },
    { id:"b2", component:"Button", text:"取消" },
  ]}},
]};

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

function drawComp(c, comps, kids) {
  const t = c.component || "(无名)";
  let el;
  switch (t) {
    case "Text":      el = document.createElement("div"); el.className="a2ui-text"; el.innerHTML = md(c.text); break;
    case "Column":    el = document.createElement("div"); el.className="a2ui-column"; break;
    case "Row":       el = document.createElement("div"); el.className="a2ui-row"; break;
    case "List":      el = document.createElement("div"); el.className="a2ui-list"; break;
    case "Card":      el = document.createElement("div"); el.className="a2ui-card"; break;
    case "Divider":   el = document.createElement("hr"); el.className="a2ui-divider"; break;
    case "Button":    el = document.createElement("button"); el.className="a2ui-button"; el.textContent = c.text || c.label || "按钮"; break;
    case "TextField": el = document.createElement("input"); el.className="a2ui-input"; el.placeholder = c.label || c.placeholder || ""; break;
    case "CheckBox":  el = document.createElement("label"); el.innerHTML = '<input type="checkbox"> ' + esc(c.label || ""); break;
    case "Slider":    el = document.createElement("input"); el.type="range"; break;
    case "DateTimeInput": el = document.createElement("input"); el.type="datetime-local"; break;
    case "ChoicePicker":  el = document.createElement("select"); el.className="a2ui-input"; (c.options||[]).forEach(o=>{const op=document.createElement("option");op.textContent=o.label||o.value||o;el.appendChild(op);}); break;
    case "Icon":      el = document.createElement("span"); el.className="a2ui-icon"; el.textContent = c.name || "?"; break;
    case "Image":     el = document.createElement("img"); el.className="a2ui-img"; el.src = c.url || ""; el.alt = c.description || ""; break;
    case "Video":     el = document.createElement("video"); el.controls = true; el.src = c.url || ""; break;
    case "AudioPlayer": el = document.createElement("audio"); el.controls = true; el.src = c.url || ""; break;
    case "Tabs":      el = document.createElement("div"); el.className="a2ui-column"; break;
    case "Modal":     el = document.createElement("dialog"); el.open = true; break;
    default:          el = document.createElement("div"); el.className="a2ui-unknown"; el.textContent = "未知组件：" + t;
  }
  for (const k of (kids[c.id] || [])) {
    const ch = comps.get(k);
    if (ch) el.appendChild(drawComp(ch, comps, kids));
  }
  return el;
}

function render(frame) {
  const surfaces = fold(frame);
  stage.innerHTML = "";
  if (surfaces.size === 0) { status.textContent = "这一帧里没有 surface"; return; }
  let n = 0;
  for (const s of surfaces.values()) {
    const p = plan(s);
    const wrap = document.createElement("div");
    wrap.className = "a2ui-column";
    const cap = document.createElement("div");
    cap.className = "a2ui-text";
    cap.style.color = "var(--dim)";
    cap.textContent = "surface: " + p.surfaceId + "  ·  组件 " + s.components.size + " 个" + (p.unknown.length ? "  ·  未知 " + p.unknown.length : "");
    wrap.appendChild(cap);
    for (const r of p.roots) { const c = s.components.get(r); if (c) wrap.appendChild(drawComp(c, s.components, p.kids)); }
    stage.appendChild(wrap);
    n += s.components.size;
  }
  status.textContent = "★ 画出来了：" + surfaces.size + " 个 surface ／ " + n + " 个组件";
}

async function loadPath(p) {
  status.textContent = "读 " + p + " …";
  try { const r = await fetch(p, {cache:"no-store"}); if (!r.ok) throw new Error("HTTP " + r.status); render(await r.json()); }
  catch (e) { status.textContent = "★ 读不到（" + e.message + "）—— 试试点「看内置样例」"; }
}

document.getElementById("load").onclick = () => loadPath(document.getElementById("src").value.trim());
document.getElementById("demo").onclick = () => render(DEMO);
document.getElementById("drop").onclick = () => {
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { render(JSON.parse(fr.result)); } catch(e){ status.textContent="★ 不是合法 JSON"; } }; fr.readAsText(f); };
  inp.click();
};
loadPath(document.getElementById("src").value.trim());
window.__a2ui = { render };
</script>
</body>
</html>
