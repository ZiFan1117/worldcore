<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>AIOS · A2UI 活渲染器</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --line:#30363d; --card:#161b22; --accent:#58a6ff; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--fg)}
  #wrap{padding:16px}
  #bar{color:var(--dim);font-size:12px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .a2ui-text{white-space:pre-wrap}
  .a2ui-text b{color:var(--accent)}
  .a2ui-column{display:flex;flex-direction:column;gap:10px}
  .a2ui-row{display:flex;flex-direction:row;gap:10px;align-items:center;flex-wrap:wrap}
  .a2ui-list{display:flex;flex-direction:column;gap:6px}
  .a2ui-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .a2ui-divider{border:0;border-top:1px solid var(--line);margin:8px 0}
  .a2ui-button{background:var(--accent);color:#0d1117;font-weight:600;border:0;border-radius:6px;padding:7px 14px}
  .a2ui-input{background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
  .a2ui-unknown{color:#f85149;border:1px dashed #f85149;border-radius:6px;padding:4px 8px}
  .a2ui-icon{font-size:18px}.a2ui-img{max-width:100%;border-radius:8px}
</style></head><body>
<div id="wrap"><div id="bar">等帧 …</div><div id="stage"></div></div>
<script>
// ★★★ A2UI 活渲染器 —— 作者令（逐字）：「我们是希望 A2UI 做 GUI」
//   ★ 一个页面【长期活着】：每秒读一次落盘的帧；变了就重画（★ 不重新加载页面）。
//   ★ 支持 @template（列表模板）＋ 数据绑定（"/path" 指向 dataModel）。
const FRAME_URL = (location.search.match(/frame=([^&]+)/) || [])[1] || "/run/aios/gui-frame.json";
const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md  = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");

function getPath(root, path){
  if (!path) return undefined;
  const p = String(path).replace(/^\//,"").split("/").filter(Boolean);
  let cur = root;
  for (const k of p){ if (cur == null) return undefined; cur = cur[k]; }
  return cur;
}

function fold(frame){
  const s = { surfaceId:"", catalogId:"", components:new Map(), order:[], root:null, dataModel: frame.dataModel || {} };
  for (const m of (frame.messages||[])){
    if (m.createSurface){ s.surfaceId = m.createSurface.surfaceId; s.catalogId = m.createSurface.catalogId||""; }
    if (m.dataModel) s.dataModel = Object.assign({}, s.dataModel, m.dataModel);
    if (m.updateDataModel) s.dataModel = Object.assign({}, s.dataModel, m.updateDataModel.data||{});
    if (m.updateComponents) for (const c of (m.updateComponents.components||[])){ s.components.set(c.id,c); s.order.push(c.id); }
    if (m.beginRendering) s.root = m.beginRendering.root;
  }
  if (!s.root){
    const refd = new Set();
    for (const c of s.components.values()){
      const ch = c.children;
      if (Array.isArray(ch)) ch.forEach(k=>refd.add(k));
      if (typeof ch === "string") refd.add(ch);
      if (c.child) refd.add(c.child);
    }
    s.root = [...s.components.keys()].find(k=>!refd.has(k)) || null;
  }
  return s;
}

let unknown=0, total=0, tpl=0;
function kidsOf(comp, data){
  const ch = comp.children;
  if (Array.isArray(ch)) return ch;                        // ★ 静态子
  if (typeof ch === "string") return [ch];                // ★ 单个子
  if (ch && ch["@template"]){
    tpl++;
    const t = ch["@template"];
    const rows = getPath(data, t.data);
    if (!Array.isArray(rows)) return [];                  // ★ 没数据 ⇒ 空
    // ★ 每个 item 展开：把 row 模板里的 {"path": "/x"} 换成行数据
    return rows.map(() => t.item);                        // ★ 简化：同一个模板 id 重复
  }
  return [];
}

function draw(comp, s, rowData){
  total++;
  const t = comp.component || "(无名)"; let el;
  const bind = v => (v && typeof v === "object" && v.path) ? getPath(rowData || s.dataModel, v.path) : v;
  switch(t){
    case "Text": el=document.createElement("div"); el.className="a2ui-text"; el.innerHTML=md(bind(comp.text) ?? comp.text); break;
    case "Column": el=document.createElement("div"); el.className="a2ui-column"; break;
    case "Row": el=document.createElement("div"); el.className="a2ui-row"; break;
    case "List": el=document.createElement("div"); el.className="a2ui-list"; break;
    case "Card": el=document.createElement("div"); el.className="a2ui-card"; break;
    case "Divider": el=document.createElement("hr"); el.className="a2ui-divider"; break;
    case "Button": el=document.createElement("button"); el.className="a2ui-button"; el.textContent=bind(comp.text||comp.label)||"按钮"; break;
    case "TextField": el=document.createElement("input"); el.className="a2ui-input"; el.placeholder=comp.label||""; break;
    case "CheckBox": el=document.createElement("label"); el.innerHTML='<input type="checkbox"> '+esc(comp.label||""); break;
    case "Slider": el=document.createElement("input"); el.type="range"; break;
    case "DateTimeInput": el=document.createElement("input"); el.type="datetime-local"; break;
    case "ChoicePicker": el=document.createElement("select"); el.className="a2ui-input"; (comp.options||[]).forEach(o=>{const op=document.createElement("option");op.textContent=(o&&o.label)||o;el.appendChild(op)}); break;
    case "Icon": el=document.createElement("span"); el.className="a2ui-icon"; el.textContent=comp.name||"?"; break;
    case "Image": el=document.createElement("img"); el.className="a2ui-img"; el.src=comp.url||""; el.alt=comp.description||""; break;
    case "Video": el=document.createElement("video"); el.controls=true; el.src=comp.url||""; break;
    case "AudioPlayer": el=document.createElement("audio"); el.controls=true; el.src=comp.url||""; break;
    case "Tabs": el=document.createElement("div"); el.className="a2ui-column"; break;
    case "Modal": el=document.createElement("dialog"); el.open=true; break;
    default: el=document.createElement("div"); el.className="a2ui-unknown"; el.textContent="未知组件："+t; unknown++;
  }
  const kids = (t==="Card" && comp.child) ? [comp.child] : kidsOf(comp, rowData || s.dataModel);
  for (const k of kids){ const c = s.components.get(k); if (c) el.appendChild(draw(c, s, rowData)); }
  return el;
}

function render(frame){
  unknown=0; total=0; tpl=0;
  const stage = document.getElementById("stage");
  const bar = document.getElementById("bar");
  try {
    const s = fold(frame);
    stage.innerHTML = "";
    if (!s.root || !s.components.has(s.root)) { bar.textContent = "帧里没有根组件"; return; }
    stage.appendChild(draw(s.components.get(s.root), s));
    bar.textContent = "✓ " + (frame.name||"(无名)") + " ／ surface=" + s.surfaceId
      + " ／ 组件 " + total + " ／ 模板 " + tpl + " ／ 未知 " + unknown
      + " ／ dataModel 键 " + Object.keys(s.dataModel||{}).join(",");
    document.title = "A2UI " + total + " 组件";
  } catch (e) {
    bar.textContent = "渲染失败: " + e;
    stage.innerHTML = '<pre style="color:#f85149;white-space:pre-wrap">' + esc(e.stack||String(e)) + '</pre>';
  }
}

let last = "";
async function tick(){
  try {
    const r = await fetch(FRAME_URL + "?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) { document.getElementById("bar").textContent = "读帧失败: HTTP " + r.status + " （" + FRAME_URL + "）"; return; }
    const txt = await r.text();
    if (txt === last) return;               // ★ 没变就不重画
    last = txt;
    render(JSON.parse(txt));
  } catch (e) {
    document.getElementById("bar").textContent = "等帧 …（" + e.message + "）";
  }
}
tick(); setInterval(tick, 1000);            // ★ 每秒看一眼
</script></body></html>
