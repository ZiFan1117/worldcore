name: opsx-swe-gb
version: 1
description: "项目级 OpenSpec 工作流：产物链以 OpenSpec 为准（proposal → specs ∥ design → tasks → review）；流程侧要件（影响分析、≥2 方案、评审签字、需求号追溯）作件内栏位与附表，不另立册子、不设双份登记。判据：OpenSpec 有的跟 OpenSpec；OpenSpec 没有的跟流程；两边都有的——形态随 OpenSpec、内容随流程。"
artifacts:
  - id: proposal
    generates: proposal.md
    description: "变更请求（CR/FC）：为什么改、改什么、不改的后果、档位与敏感路径判定"
    template: proposal.md
    instruction: |
      本件＝本次改动的**变更请求**，**就是这一份**：不另写一张申请单，也不在别处留指针。
      字段集参照流程侧变更申请单的要素（为什么改／改什么／档位／影响面），要素落在本件里。

      **变更号写在文档头的属性表里**（标题之下的第一张表，见 `templates/proposal.md`；**不是"首行"**——首行是标题），形如 `CR: WC-CR-007`（框架变更写 `FC: WC-FC-2026-003`）。
      这个号要与 change 目录名一致（`cr-007-<slug>`）。**号由人给，agent 不自己编号。**

      必填节：
      - **Why**：为什么改。必须写清**不改的后果**——这是判"一件事还是两件事"的唯一判据
        （"若两处改动的不改的后果不同，就是两个变更"）。
      - **What Changes**：改什么。要具体到能力/文件/行为。
      - **Capabilities**：新增/修改哪些能力，对应 `specs/<capability-path>/spec.md`。
      - **档位判定**：A 档还是 B 档。三条判据全不命中才可 A 档：① 没有第二个人需要交接
        ② 没有外部交付物或验收责任 ③ 失效后果可接受。走 GitHub PR 一律按 **B 档**。
      - **评审档位**：R4 还是 R5。判据：**触及契约 / 门禁 / 工具 / 工作流 → 框架变更 → R5**；
        否则 R4。把命中的敏感路径逐条列出（`ninedim/01-意图环/04-规格/**`、`docs/openspec-config.yaml`、
        `tools/**`、`.github/workflows/**`、`.scope-declaration.json`）。
      - **Impact**：受影响面。

      若判定为 R5，本件同时充当**框架变更申请单**：必须带触发条件编号（FC-1…FC-6）
      与**现象证据**。FC-6（个人偏好类"我觉得这样更优雅"）一律驳回。

      保持 1–2 页。重点是"为什么"，"怎么做"归 design。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: "需求增量：### Requirement: REQ-xxx 标题，每条带可复现的验收场景与证据行"
    template: spec.md
    instruction: |
      这是**需求增量**。本仓的规格树是需求内容的**机读权威载体**；流程侧的 SRS 与 RTM
      是同一批需求的**文档形态与追溯面**——两边**靠编号对齐，不复制内容**。

      **编号是主键。** 每条 `### Requirement:` 的标题必须**以 REQ 号开头**：

          ### Requirement: REQ-F-012 单笔上限校验

      号从流程侧取（SRS / RTM 已在用的号），**永不复用、废弃留行、写全左补零**
      （`REQ-F-012` 不写 `REQ-F-12`）。**取不到号时登记为「无号·待增补」，不许自造、不许拿相近号硬凑。**

      **每条 Requirement 至少一个 Scenario**，且每个 Scenario 必须用**恰好四个 `#`**。
      每条 Scenario 末尾必须有证据行：

          - **证据**：`path/to/test_file::test_name`（或 `tools/x.py --self-test`）

      证据行的测试名必须是**真实存在**的。OpenSpec 的 `validate` 不校验这一点，
      由项目自建的 `spec_bridge.py` 补上存在性校验——否则它会随时间失效。

      四个操作头（delta 语义）：
      - `## ADDED Requirements` 新增
      - `## MODIFIED Requirements` 改行为，**必须带全存活 Scenario**（不许只贴改动部分）
      - `## REMOVED Requirements` 必须带 **Reason** 与 **Migration**
      - `## RENAMED Requirements` 只改名，用 FROM:/TO:

      新能力才写 `## Purpose`（≥50 字）；已有能力不要写，它已有 Purpose。

      **只装"已成立且可复现"的行为。** 未定的、待裁的、已知残余风险，
      一律写进 `design.md` 的**排除清单**，不要写进规格——否则就是把未定当已定。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: "影响分析 + 回归范围 + ≥2 方案（含不改案）+ 排除清单"
    template: design.md
    instruction: |
      本件是本次 change 的设计件。其中「影响分析」与「方案对比」两节的**填法**按流程侧 R5
      的要求（那两条是流程的经验，内容随流程），**载体就是本件**——不另写一份影响分析。

      必填节：

      - **Context**：塑造做法的现状与约束。不要重述 proposal 的动机。
      - **Goals / Non-Goals**：本设计要达到什么、明确排除什么。
      - **影响分析**（R5 准入要件）：
        - 受影响的**模块**；
        - 受影响的**需求**（列 REQ 号）；
        - **需重跑哪些测试**；
        - **回归范围可推导**：按 R-A / R-B / R-C / R-D 给出；
        - **工作量估算**；
        - **需通知的使用方**（破坏性变更必须通知全部使用方；无则写"无"）。
      - **方案对比（≥2 个，必须含"不改"或"最小改"案）**：
        这是 R5 的★准出项，缺一个就驳回。每案写：做什么 / 代价 / 为什么选或不选。
      - **Decisions**：定下来的技术选择与理由。
      - **Risks / Trade-offs**：`[风险] → [缓解]` 逐条。
      - **排除清单**：**明确不写进 specs 的东西，逐条给出处**。未定项、待人裁项、
        已知残余风险都放这里。这一节是本档位与普通 OpenSpec 最大的差别之一——
        它让"哪些是已定的"与"哪些不是"在同一份材料里可核。
      - **L5 覆盖边界**（**书 L5 那一层的落点**）：**"规格已定、只是今天没做到"的东西放这里**——
        逐条给：① **书里的判据出处**（章·节或行号）② **今天的实测读数**（红／绿，带命令与输出）
        ③ **为什么还没做到** ④ **落点**（哪个 change、或 `tasks.md` 第几组）。
        **这一节不得被读成"能力已成立"**——它登记的正是"还没成立"。
        与「排除清单」的分界：**能判红绿的进本节**（规格已定、只是没做到）；
        **判不了红绿的进排除清单**（规格本身还没定）——这就是书的 L5 与 L6 的分界。
      - **Migration Plan**：落地步骤与回滚策略。
      - **Open Questions**：可以延后定、且不影响规格/做法/任务拆分的问题。

      若本件是为 R5 而写：**触发条件编号（FC-1…FC-6）与现象证据**必须写在影响分析里。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: "实施与验证步骤，每条自带完成判据"
    template: tasks.md
    instruction: |
      写任务前先看 `design.md` 的 Open Questions：凡会改变"要造什么"的，先与人定，
      不要把没写出来的假设烤进任务表。

      **严格遵守复选框格式**：`- [ ] X.Y 任务描述`。只有 `x`（大小写、空格不限）算完成；
      `- [~]` / `- [-]` / `- []` 一律算未完成；没有复选框的行不被跟踪。

      规矩：
      - 按依赖分组，`## 1.` `## 2.` 编号；**最后一组固定是 `## 3. 验证与取证`**（见 `templates/tasks.md`）——集成检查只放那一组；
      - **每条任务自带验收方式**（一条测试、一条命令、一个可观察行为、或一件交付物），
        写在该条的描述里。只有跨多个任务的整体验证才单独成条；
      - **每组自带该组该有的测试与文档**，不许把测试与文档堆到最后一组——
        最后一组只放集成检查；
      - 单条任务小到能一次会话做完。

      **归档门禁要求 tasks 全勾。** 若某条本来就做不完（常设维护项），
      不要留在本件里：它在 `tasks.md` 里会永久挡住 `openspec validate --archived`。
      常设项写进项目自己的维护清单。

      任务写在实施前，状态随实施更新。规格说做什么，design 说怎么做，本件说分几步。
    requires:
      - specs
      - design

  - id: review
    generates: review.md
    description: "R4/R5 评审记录与签字。R5 前置（方向批准）；R4 后置（实施完成后、归档前）"
    template: review.md
    instruction: |
      本件是**评审与签字那道闸**。OpenSpec 本身没有角色概念（它允许 agent 自己
      propose → apply → archive）；评审与签字是**流程侧的经验**（R0–R8、执行者不能是唯一批准者）。
      按分工判据它归流程，而**载体落在本 change 上**——不另立册子、不设双份登记。

      **两个档位的时机不同，这是本工作流的硬约定：**

      - **R5（框架变更评审）＝ 前置闸。** 准入是"变更申请单 + 影响分析已完成"，
        而这两样就是 `proposal.md`（含 FC-1…FC-6 触发条件与现象证据）与
        `design.md`（含 ≥2 方案对比、含"不改"案）。**未获 R5 批准不得进入实施。**
        本件的 R5 节在 apply 之前填、签字。
      - **R4（模块评审）＝ 后置闸。** 准入是"模块代码已提交（含单元测试），附提交号；
        详细设计说明中该模块章节已更新"——**代码没写完就没什么可审的**。
        所以本件的 R4 节在 apply 之后、**归档之前**填、签字。

      因此：**本件是归档的硬前置**，由两处共同承担：`openspec validate --archived`（tasks 全勾）
      ＋ `spec_bridge.py` 判据①（归档目录必须有本件）。
      ⚠ **`openspec archive` 命令本身不拦**（实测：缺本件、甚至 0/1 tasks 未勾时，`archive --yes` 仍 `rc=0`）
      ⇒ 二选一：**归档前先跑 `python3 scripts/verify/spec_bridge.py`**，或**归档后立即跑它、红了就回退**。
      另：**未签的本件不算已归档**——判据⑥ 读结论栏与批准人栏，未签/占位一律判红。

      必填：
      - **变更号与档位**：CR/FC 号，R4 还是 R5；
      - **提出人 / 影响分析人 / 批准人 / 结论 / 日期**——**五栏**都要有真实标识；
      - **执行者与批准者的分离声明**：写明二者不同人。同一人兼任时（仅 A 档允许），
        必须写明"换身份复核"的方式；
      - **R4 准出逐项**：接口契约符合 / 覆盖率（行 ≥80%、核心分支 ≥90%，裁剪须声明）/
        正常·边界·异常·空值四类路径 / 无遗留 P0-P1 / 单元测试全过 / 无新增循环依赖 /
        框架适配性回判已执行 / 设计文档与代码无漂移 /
        至少 1 名同级开发完成代码走查并签字；
      - **R5 准出逐项**：触发条件成立（**FC-6 个人偏好一律驳回**）/
        ≥2 方案对比含不改案 / 影响范围明确且回归范围可推导 / 破坏性变更已通知全部使用方 /
        批准后有确定的新框架版本号 / **驳回的变更已记入技术债清单（驳回 ≠ 删除）**；
      - **环境指纹**：验收在哪台机器、什么版本上跑的。**只在本地跑过、无法复现的结果
        不作为门禁依据**；
      - **结论**：**R4 ＝ 通过 / 有条件通过 / 退回；R5 ＝ 批准 / 驳回**（两档不许混，出处 `附件三-评审与门禁.md:96-97` 的「结论形式」列）。
      - **必填栏位（模板已补，逐栏见 `templates/review.md`）**：主持人 / 必参（含**测试**席位，"缺测试参与的评审无效"）/ 逐条评审记录（含 `证据类型` EV-11a·EV-11b）/ **本档不能证明的事** / **"技术内容已被评审并给出裁定"＝独立准出项**（与"格式齐备"分列两条，只有前者不算过）/ **H-14 追认登记表** / 环境指纹。

      **签字与责任归属归人，不可代签。** 本件由人填；agent 只能准备材料、跑门禁、贴原始输出。
    requires:
      - tasks

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    **实施前先确认方向已批准：**
    - 若本 change 判定为 **R5**（触及契约 / 门禁 / 工具 / 工作流），
      `review.md` 的 R5 节必须已签"批准"——**未批准的框架变更不许进入实施**；
    - 若判定为 **R4**，方向无需单独批，直接实施。

    然后按 `tasks.md` 逐条做，做完一条勾一条。代码改动必须过 `scope_check.py`：
    越出 `.scope-declaration.json` 声明的范围即 rc=1。

    **实施完成后、归档之前**，补 `review.md` 的 R4 节并取得签字
    （代码走查人 + 批准人，执行者不得为唯一批准者）——缺本件不许归档。

    遇到阻塞停下来问，不要绕过。

